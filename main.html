<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
</head>
<body>
	 <div id="myCarousel" class="carousel slide" data-ride="carousel">

        <div class="carousel-inner">

            <div class="item first-slide">
                <img src="https://picsum.photos/id/1015/1200/400"
                     alt="First Slide">
            </div>

            <div class="item second-slide">
                <img src="https://picsum.photos/id/1018/1200/400"
                     alt="Second Slide">
            </div>

            <div class="item third-slide active">
                <img src="https://picsum.photos/id/1019/1200/400"
                     alt="Third Slide">
            </div>

            <div class="item fourth-slide">
                <img src="https://picsum.photos/id/1020/1200/400"
                     alt="Fourth Slide">
            </div>

            <div class="item fifth-slide">
                <img src="https://picsum.photos/id/1024/1200/400"
                     alt="Fifth Slide">
            </div>

        </div>


        <a class="left carousel-control"
           href="#myCarousel"
           data-slide="prev">

            <span class="glyphicon glyphicon-chevron-left"></span>

        </a>

       
        <a class="right carousel-control"
           href="#myCarousel"
           data-slide="next">

            <span class="glyphicon glyphicon-chevron-right"></span>

        </a>

    </div>

    <!-- Write your code here -->
    <!-- Bootstrap Bundle with Popper -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</body>
 
</html>
